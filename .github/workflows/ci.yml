name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  mcp-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/ui
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: mcp/ui/package-lock.json
    - run: npm ci
    - run: npm run build
    - name: Check committed UI bundle
      run: git diff --exit-code -- app.html
    - run: npm test
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    
    - name: Setup Nix environment
      run: nix develop --command echo "Nix environment ready"
    
    - name: Generate docs
      run: nix develop --command just generate
    
    - name: Run tests
      run: nix develop --command just test
    
    - name: Run build
      run: nix develop --command just build
    
    - name: Run linting
      run: nix develop --command just lint
