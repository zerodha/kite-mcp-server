{{define "base"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{.Title}} – Kite MCP Server</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            :root {
                --primary: #387ed1;
                --primary-dark: #2f6db6;
                --accent: #ff6b35;
                --success: #00b386;
                --bg: #fafbfc;
                --card-bg: #ffffff;
                --heading: #1f2937;
                --text: #4b5563;
                --text-muted: #94a3b8;
                --border: #e5eaf0;
                --radius: 12px;
                --shadow: 0 16px 40px rgba(31, 41, 55, 0.08);
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background:
                    radial-gradient(circle at top, rgba(56, 126, 209, 0.08), transparent 36%),
                    var(--bg);
                font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: var(--text);
                line-height: 1.6;
                padding: 24px;
            }

            .card {
                background: var(--card-bg);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 2rem;
                width: 100%;
                max-width: 440px;
                text-align: center;
            }

            .icon {
                width: 56px;
                height: 56px;
                margin: 0 auto 0.5rem;
            }

            .icon svg {
                width: 100%;
                height: 100%;
                display: block;
            }

            h1 {
                margin: 0 0 0.25rem;
                font-size: 1.75rem;
                font-weight: 600;
                color: var(--heading);
                line-height: 1.2;
                letter-spacing: -0.02em;
            }

            .status {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                align-self: center;
                font-size: 0.9rem;
                font-weight: 600;
                color: var(--primary);
                background: rgba(56, 126, 209, 0.08);
                border: 1px solid rgba(56, 126, 209, 0.14);
                border-radius: 999px;
                padding: 0.4rem 0.75rem;
                margin: 0 auto 0.5rem;
            }

            .status::before {
                content: "";
                width: 8px;
                height: 8px;
                border-radius: 999px;
                background: var(--accent);
                display: inline-block;
            }

            p {
                margin: 0;
                font-size: 0.95rem;
                line-height: 1.65;
                color: var(--text);
            }

            .stack {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .eyebrow {
                font-size: 0.78rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--primary);
            }

            .actions {
                display: flex;
                justify-content: center;
                margin-top: 1.5rem;
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 46px;
                padding: 0.8rem 1.15rem;
                border-radius: 10px;
                border: 1px solid var(--primary);
                background: var(--primary);
                color: #fff;
                font-size: 0.95rem;
                font-weight: 600;
                text-decoration: none;
                box-shadow: 0 10px 22px rgba(56, 126, 209, 0.18);
                transition: background 120ms ease, transform 120ms ease, box-shadow 120ms ease;
            }

            .button:hover {
                background: var(--primary-dark);
                transform: translateY(-1px);
                box-shadow: 0 14px 26px rgba(56, 126, 209, 0.22);
            }

            .notice {
                text-align: left;
                background: linear-gradient(180deg, #fff8f4 0%, #fff5ee 100%);
                border: 1px solid #ffd8c8;
                border-radius: 10px;
                padding: 0.95rem 1rem;
                font-size: 0.9rem;
                color: #7c4a2d;
            }

            .notice strong {
                display: block;
                margin-bottom: 0.35rem;
                color: var(--heading);
                font-size: 0.82rem;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .info {
                color: var(--text);
                font-size: 0.875rem;
            }

            .version {
                background: var(--bg);
                padding: 0.5rem 0.75rem;
                border-radius: 4px;
                font-family: monospace;
                font-size: 0.75rem;
                display: inline-block;
                margin-top: 0.5rem;
                color: var(--heading);
            }

            .footer {
                position: absolute;
                bottom: 20px;
                text-align: center;
                width: 100%;
                font-size: 0.75rem;
                color: var(--text-muted);
            }

            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }

                .card {
                    padding: 1.5rem 1.25rem;
                }

                h1 {
                    font-size: 1.5rem;
                }
            }
        </style>
    </head>
    <body>
        {{template "content" .}}
        
        <div class="footer">
            &copy; Zerodha&nbsp;&bull;&nbsp;Kite MCP Server
        </div>
    </body>
</html>
{{end}}
