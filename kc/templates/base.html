{{define "base"}}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{.Title}} – Kite MCP Server</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        {{template "brand-assets" .}}
        <style>
            /* Measured from the official Kite login page; see design-qa.md. */
            :root {
                --primary: #ff5722;
                --success: #4caf50;
                --bg: #f8f8f8;
                --heading: #444;
                --text: #444;
                --text-muted: #9b9b9b;
                --border: #eee;
            }
            *, *::before, *::after { box-sizing: border-box; }
            body {
                margin: 0;
                background: var(--bg);
                font-family: "Open Sans", sans-serif;
                font-size: 14px;
                font-weight: 400;
                color: var(--text);
                line-height: 1.6;
            }
            .card {
                background: #fff;
                border: 2px solid var(--border);
                border-radius: 5px;
                box-shadow: 1px 1px 4px #eee;
                padding: 40px;
                width: 360px;
                max-width: 100%;
                margin: 60px auto 40px;
                text-align: center;
            }
            .brand { margin-bottom: 30px; }
            .brand img { vertical-align: baseline; }
            h1 {
                margin: 0 0 20px;
                font-size: 21px;
                font-weight: 400;
                color: var(--heading);
                line-height: 1.5;
            }
            p { margin: 0 0 20px; }
            .status { margin-bottom: 20px; color: var(--success); }
            .info { font-size: 14px; }
            .version {
                background: var(--bg);
                padding: 5px 8px;
                border-radius: 3px;
                font-family: monospace;
                font-size: 12px;
                display: inline-block;
            }
            .disclaimer {
                margin: 0 0 30px;
                padding: 15px;
                border: 1px solid var(--border);
                border-radius: 3px;
                text-align: left;
                font-size: 12px;
            }
            .disclaimer strong { display: block; margin-bottom: 5px; font-weight: 600; }
            .actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 0; }
            .button {
                display: block;
                width: 100%;
                padding: 10px 20px;
                border: 1px solid var(--primary);
                border-radius: 3px;
                background: var(--primary);
                color: #fff;
                font-family: inherit;
                font-size: 14.8px;
                font-weight: 400;
                line-height: 1.5;
                text-decoration: none;
                cursor: pointer;
                white-space: normal;
                overflow-wrap: anywhere;
            }
            .button:hover { background: #ff6e40; border-color: #ff6e40; }
            .button-secondary { background: #fff; border-color: #ddd; color: var(--text); }
            .button-secondary:hover { background: var(--bg); border-color: #bbb; }
            a:focus-visible, button:focus-visible { outline: 3px solid #c9ddff; outline-offset: 3px; }
            .footer {
                width: 360px;
                max-width: 100%;
                margin: 0 auto 30px;
                padding: 0 20px;
                text-align: center;
                font-size: 12px;
                color: var(--text-muted);
            }
            .footer img { display: block; margin: 0 auto 20px; }
            .footer p { margin: 0; }
            @media (max-width: 1023px) {
                body { background: #fff; font-size: 16px; }
                h1 { font-size: 24px; }
            }
            @media (max-width: 550px) {
                .card { width: 100%; margin: 0 auto 30px; padding: 40px 30px 20px; }
                .footer { width: 100%; }
            }
        </style>
    </head>
    <body>
        <main class="card">
            <header class="brand">{{template "kite-logo" .}}</header>
            {{template "content" .}}
        </main>
        <footer class="footer">
            {{template "zerodha-logo" .}}
            <p>&copy; Zerodha &bull; Kite MCP Server</p>
        </footer>
    </body>
</html>
{{end}}
